<!doctype html>
<!--
  Web HTML template (used by `expo export -p web` and the dev server because
  web.output is 'single' — app/+html.tsx only applies to 'static' output).
  The lang attribute and title below are substituted from app.config.ts at
  build time; only their FIRST occurrence in this file is replaced, so don't
  repeat those placeholder tokens anywhere above them.

  Carries the PWA install contract: the manifest link for Android/Chrome and the
  apple-* tags iOS Safari needs (iOS ignores most of the manifest). Keep the app
  identity in public/manifest.json in sync with the name in app.config.ts.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <!-- Web app manifest — the install contract for Android/Chrome -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />

    <!-- iOS home-screen support. No apple-mobile-web-app-title: iOS falls back to
         <title>, which is substituted from app.config.ts and stays in sync. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- App typeface. Declared here rather than injected at runtime so the very
         first paint already has it; a script-injected stylesheet arrives after the
         first frame and the app visibly reflows from the fallback face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Anton&display=swap"
    />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #faf6f0;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        /* Phone layout, centred: the same cap as CONTENT_MAX_WIDTH in
           lib/platform.ts. Without it the app stretches across a desktop window
           or a mirrored projector and the column layout falls apart. */
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
      }
    </style>

    <style id="app-typography">
      :root {
        --app-font-sans:
          'Inter', 'Inter_400Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        --app-font-mono:
          ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
        /* Brand lockup only. Second entry is the copy expo-font registers, so a
           blocked CDN still gets Anton; then condensed heavies that ship with the
           OS, because a normal-width fallback would not read as the mark. */
        --app-font-display:
          'Anton', 'Anton_400Regular', 'Haettenschweiler', 'Arial Narrow', Impact,
          var(--app-font-sans);
      }

      html,
      body {
        font-family: var(--app-font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* react-native-web writes its own font on every text node it renders, so
         inheriting from <body> is not enough — the app face needs a selector that
         outranks the generated one. Monospaced text opts out through data-mono,
         which components/ui/MonoText.tsx sets on web. */
      #root [class]:not([data-mono]):not([data-display]) {
        font-family: var(--app-font-sans);
      }

      #root [data-mono] {
        font-family: var(--app-font-mono);
      }

      #root [data-display] {
        font-family: var(--app-font-display);
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
